[memories_creation]
	#Skills Ahura Mazda cannot store through Memories Creation. Use namespace:path ids.
	skill_blacklist = ["tensura:predator", "tensura:gluttony", "tensura:gourmand", "tensura:gourmet", "tensura:starved", "tensura:engorger", "tensura:usurper", "tensura:reaper", "tensura:chosen_one", "tensura:analyst", "troverhaul:carnation", "troverhaul:imitator", "troverhaul:looter", "troverhaul:scavenger", "trcustom:hariti"]
	#Allows Ahura Mazda to record Ultimate Skills into memory. Experimental and disabled by default.
	record_ultimate_skills = false
	#Allows Ahura Mazda to recreate recorded Ultimate Skills for its owner. Requires record_ultimate_skills or another configured source.
	recreate_ultimate_skills = false
	#Allows Friend of Creation to grant Ultimate Skills to other players. Experimental and disabled by default.
	grant_ultimate_skills = false
	#Allows Ahura Mazda to record Unique Skills into memory.
	record_unique_skills = true
	#Allows Ahura Mazda to record Intrinsic or Resistance/racial skills into memory. Disabled by default.
	record_intrinsic_or_racial_skills = false

