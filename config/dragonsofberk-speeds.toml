#Dragon Speed Config: per-dragon speed multiplier + shared vertical flight settings.
[Flight]
	#Ascend key (jump) climb speed, as a ratio of the dragon's own max horizontal air speed.
	# Default: 0.5
	# Range: 0.05 ~ 3.0
	flight_climb_speed_ratio = 0.5
	#Descend key (sneak) dive speed, as a ratio of the dragon's own max horizontal air speed.
	# Default: 0.6
	# Range: 0.05 ~ 3.0
	flight_descent_speed_ratio = 0.6
	#Speed bonus while the rider holds the dragon-sprint key and moves forward.
	# Default: 1.4
	# Range: 1.0 ~ 5.0
	flight_sprint_multiplier = 1.4

["Night Fury"]
	#Overall speed multiplier (flying, walking, climbing and diving). 1.0 = vanilla behavior.
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	night_fury_speed_multiplier = 1.0

