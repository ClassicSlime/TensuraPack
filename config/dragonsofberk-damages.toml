[Stormcutter]
	#Max health.
	# Default: 125.0
	# Range: 1.0 ~ 1024.0
	stormcutter_max_health = 125.0
	#Armor. Level with the Monstrous Nightmare and Triple Stryke, the other heavies. It was briefly raised to 5 to close a gap with the Gronckle; the Gronckle was brought down instead, so this went back to the tier's normal figure.
	# Default: 4.0
	# Range: 0.0 ~ 30.0
	stormcutter_armor = 4.0
	#Bite (melee) damage.
	# Default: 7.0
	# Range: 0.0 ~ 500.0
	stormcutter_bite_damage = 7.0
	#FireBreathProjectile direct-hit damage. Raised from 4 on tester feedback (2026-08-30): the fire read as too weak. Doubled to 8 first, then settled at 5 by the user - most of a breath's damage comes from the beam tick below, not from this.
	# Default: 5.0
	# Range: 0.0 ~ 500.0
	stormcutter_fire_breath_damage = 5.0
	#Continuous beam damage per entity per tick, for the Stormcutter ONLY. Exists because the shared fire_breath_projectile_beam_tick_damage is where nearly all of a breath's damage actually comes from, so doubling the direct hit alone would barely have been felt - and the user asked for the Stormcutter's fire to double without touching the other breath users. Double the shared value of 3.
	# Default: 6.0
	# Range: 0.0 ~ 500.0
	stormcutter_fire_breath_beam_tick_damage = 6.0
	#Sonic boom (2nd ability) damage. Small on purpose: the payload is the stun, not the damage.
	# Default: 3.0
	# Range: 0.0 ~ 500.0
	stormcutter_sonic_boom_damage = 3.0

