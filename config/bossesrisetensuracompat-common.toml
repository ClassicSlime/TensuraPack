# Bosses'Rise x Tensura: Reincarnated compatibility config
# Grants EP (Existence Points) and Tensura skills to Bosses'Rise world bosses
# the first time each boss is encountered.

[general]
# Grant EP to bosses on spawn.
grant_ep = true
# Grant Tensura skills to bosses on spawn.
grant_skills = true
# If false (default), a boss's EP is only set the first time it is seen
# (i.e. only if its current EP is below the configured value). If true,
# EP is force-set to the configured value every time the boss (re)loads.
overwrite_existing_ep = false
# Attach an AI goal to bosses/tentacle so they periodically cast one of
# their active skills (e.g. Flame Breath, Water Domination). Minions never
# get this goal regardless of this setting - only entries with active skills do.
grant_active_skill_ai = true

[infernal_dragon]
# Infernal Dragon (boss-tier, can cast active skills)
enabled = true
ep = 400000

