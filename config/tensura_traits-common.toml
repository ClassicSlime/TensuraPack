#Chance from 0 to 100 that a player starts with a trait.
# Default: 100.0
# Range: 0.0 ~ 100.0
playerStartingTraitChance = 100.0
#Chance from 0 to 100 that a newly spawned Tensura NPC starts with a trait.
# Default: 25.0
# Range: 0.0 ~ 100.0
npcStartingTraitChance = 25.0
#Maximum number of traits a player can receive when first spawning.
# Default: 1
# Range: 0 ~ 128
maxPlayerStartingTraits = 1
#Whether traits may be acquired after initial spawning, including through trait books.
traitsGainable = true
#Whether traits classified as True Passive may be manually toggled off and on.
truePassivesToggleable = false
#Whether entities belonging to the Tensura mod may naturally receive traits.
npcTraitsEnabled = true
#Maximum number of traits a newly spawned Tensura NPC can receive.
# Default: 1
# Range: 0 ~ 128
maxNpcStartingTraits = 1
#Whether a Tensura child can inherit traits owned by either parent.
npcTraitInheritance = true
#Chance from 0 to 100 that a Tensura child inherits a trait owned by exactly one parent.
# Default: 25.0
# Range: 0.0 ~ 100.0
oneParentTraitInheritanceChance = 25.0
#Chance from 0 to 100 that a Tensura child inherits a trait owned by both parents.
# Default: 85.0
# Range: 0.0 ~ 100.0
bothParentsTraitInheritanceChance = 85.0
#Whether newborn Tensura NPCs can receive natural birth traits in addition to inherited traits.
npcChildNaturalTraits = true
#Chance from 0 to 100 that a newborn Tensura NPC rolls normal trait chances at birth.
# Default: 100.0
# Range: 0.0 ~ 100.0
npcChildNaturalTraitRollChance = 100.0
#Maximum distance in blocks for future family support traits.
# Default: 32.0
# Range: 1.0 ~ 256.0
supportTraitRange = 32.0
#Maximum number of matching family support traits that may stack on one recipient.
# Default: 2
# Range: 1 ~ 16
maxSupportTraitStacks = 2

[rarityWeights]
	#Relative selection weight for Common traits. Weights are normalized across available traits.
	# Default: 50.0
	# Range: 0.0 ~ 10000.0
	common = 50.0
	#Relative selection weight for Uncommon traits.
	# Default: 35.0
	# Range: 0.0 ~ 10000.0
	uncommon = 35.0
	#Relative selection weight for Rare traits.
	# Default: 10.0
	# Range: 0.0 ~ 10000.0
	rare = 10.0
	#Relative selection weight for Epic traits.
	# Default: 5.0
	# Range: 0.0 ~ 10000.0
	epic = 5.0
