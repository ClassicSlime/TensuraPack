#Where the Blood Axe gauge anchors on screen. One of: TOP_LEFT, TOP_CENTER, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT. Unrecognized values fall back to TOP_CENTER.
anchor = "TOP_CENTER"
#Pixel offset from the anchor point, X axis (positive = right).
offsetX = 0.0
#Pixel offset from the anchor point, Y axis (positive = down). Default leaves room above the bar for its stored/cap label.
offsetY = 20.0
