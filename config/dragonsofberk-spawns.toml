[Wandering]
	#How far a WILD dragon may roam from the spot it spawned on, in blocks.
	#
	#A wild dragon never despawns, and until this existed nothing held it
	#anywhere: it picked a point 150-400 blocks away, flew there, and picked
	#another one, for as long as its chunk stayed loaded. So the dragons near a
	#base drifted away and, because MobCategory.CREATURE is capped by vanilla
	#and that cap is filled by cows for the life of a world, nothing replaced
	#them. Measured on a player's server: zero dragons within 256 blocks of a
	#base, and a shell of them at more than twice the world's average density
	#256-768 blocks out. They had not been killed, they had walked out.
	#
	#Bigger = dragons range further and are rarer near you. Smaller = they stay
	#close and can look like they circle your base.
	#Set to 0 to switch the anchor off entirely and get the old behaviour back.
	# Default: 512
	# Range: 0 ~ 30000
	wander_radius = 512
