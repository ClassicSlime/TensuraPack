#Internal config schema version for Moos Tensura Addon.
#Do not edit unless you intentionally want the addon to re-apply migration defaults.
# Default: 0
# Range: > 0
configVersion = 5

[debug]
	#Enables developer commands and diagnostic tools.
	#This setting is controlled by the server.
	#Keep this disabled during normal gameplay and in release server configurations.
	#Normal players cannot use debug tools even when this is enabled; command permission checks still apply.
	enabled = false

[self_endowment]
	#Allows players to use the self-endowment system.
	enabled = true
	#Minimum vanilla XP level required before self-endowment is allowed.
	# Default: 75
	# Range: 0 ~ 100000
	requiredLevel = 75
	#Minimum current EP required before self-endowment is allowed.
	# Default: 200000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	requiredEp = 200000.0
	#Current magicules consumed by self-endowment.
	# Default: 100000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	requiredMagicules = 100000.0
	#Raw XP equivalent of this level is consumed by self-endowment.
	# Default: 50
	# Range: 0 ~ 100000
	xpLevelEquivalentCost = 50

[sage_upgrade]
	#Allows Sage to evolve into Great Sage through this addon.
	enabled = true
	#If true, the player must already have Sage before evolving it into Great Sage.
	requireSage = true
	#Minimum vanilla XP level equivalent required before Sage can evolve into Great Sage.
	# Default: 45
	# Range: 0 ~ 100000
	requiredXpLevel = 45
	#Amount of relative vanilla XP levels removed when Sage evolves into Great Sage. Example: 45 -> 20 when set to 25.
	# Default: 25
	# Range: 0 ~ 100000
	relativeLevelDeduction = 25
	#Current magicules consumed by Sage -> Great Sage.
	# Default: 0.0
	# Range: 0.0 ~ 1.7976931348623157E308
	magiculeCost = 0.0

[great_sage_ritual]
	#Allows the Great Crystal Altar ritual path for Sage -> Great Sage.
	enabled = true
	#Duration of the Great Crystal Altar ritual in ticks. 20 ticks = 1 second. Costs and skill changes happen only when this finishes.
	# Default: 300
	# Range: 40 ~ 1200
	durationTicks = 300
	#Current EP required to start the Great Crystal Altar ritual.
	# Default: 60000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	requiredEp = 60000.0
	#Amount of mastered skills required to start the Great Crystal Altar ritual.
	# Default: 1
	# Range: 0 ~ 100000
	requiredMasteredSkills = 1
	#If true, the player must be named/endowed before using the Great Crystal Altar ritual.
	requireNamed = false

[great_crystal_altar]
	#If true, Great Crystal Altars emit subtle particles when a nearby player is ready to evolve Sage into Great Sage.
	readyParticlesEnabled = true
	#How often ready-particle checks happen. 20 ticks = 1 second.
	# Default: 10
	# Range: 5 ~ 1200
	readyParticleIntervalTicks = 10
	#Horizontal block range for altar ready particles around a ritual-ready player.
	# Default: 8
	# Range: 1 ~ 64
	readyParticleRange = 8
	#Vertical block range for altar ready particles around a ritual-ready player.
	# Default: 4
	# Range: 1 ~ 32
	readyParticleVerticalRange = 4

[sage_whispers]
	#Allows Sage to occasionally give subtle actionbar hints before evolving into Great Sage.
	enabled = true
	#Initial delay before Sage can whisper after the player has Sage. 20 ticks = 1 second.
	# Default: 600
	# Range: > 20
	initialDelayTicks = 600
	#Minimum time between Sage whispers. 20 ticks = 1 second.
	# Default: 2400
	# Range: > 20
	minIntervalTicks = 2400
	#Random extra time added to the minimum whisper interval. 20 ticks = 1 second.
	# Default: 2400
	# Range: > 0
	randomIntervalTicks = 2400
	#Chance for a whisper to actually appear when the cooldown finishes. 1.0 = always, 0.5 = 50%.
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	chance = 0.75

[recognition_rewards]
	#Maximum additional EP-equivalent capacity Soul Recognition can grant from Identity Strength.
	#The actual reward scales from 0 up to this value and is split evenly between maximum magicules and maximum aura.
	#This value is frozen when a recognition ritual commits; changing it affects only future recognitions and new incarnations.
	#Set this to 0 to disable the addon's additional capacity reward without changing Tensura's native HIGH endowment.
	# Default: 1000000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	maximumExtraEp = 1000000.0

[granter_awakening]
	#Allows natural awakening of the Unique Skill Granter.
	enabled = true
	#Current EP required for natural Granter awakening.
	# Default: 200000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	requiredEp = 200000.0
	#Amount of mastered skills required for natural Granter awakening.
	# Default: 5
	# Range: 0 ~ 100000
	requiredMasteredSkills = 5
	#Amount of nearby or recognized subordinates required for natural Granter awakening.
	# Default: 5
	# Range: 0 ~ 100000
	requiredSubordinates = 5
	#Radius used to scan for nearby subordinates for Granter awakening.
	# Default: 32.0
	# Range: 1.0 ~ 512.0
	scanRadius = 32.0

[granter]
	#Current magicule cost for normal Granter skill granting.
	# Default: 200000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	grantMagiculeCost = 50000.0
	#Cooldown in ticks for normal Granter skill granting. 20 ticks = 1 second.
	# Default: 6000
	# Range: > 0
	grantCooldownTicks = 6000

[ultimate_evolution]
	#Current EP required for Granter to evolve into an Ultimate Skill.
	# Default: 1000000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	requiredEp = 1000000.0
	#Current magicules consumed by Granter Ultimate evolution.
	# Default: 500000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	requiredMagicules = 250000.0
	#Amount of mastered skills required for Granter Ultimate evolution.
	# Default: 10
	# Range: 0 ~ 100000
	requiredMasteredSkills = 10
	#Amount of successful Granter grants required for Granter Ultimate evolution.
	# Default: 10
	# Range: 0 ~ 100000
	requiredSuccessfulGrants = 10
	#Amount of nearby or recognized subordinates required for Granter Ultimate evolution.
	# Default: 10
	# Range: 0 ~ 100000
	requiredSubordinates = 10
	#Radius used to scan for nearby subordinates for Granter Ultimate evolution.
	# Default: 32.0
	# Range: 1.0 ~ 512.0
	scanRadius = 32.0

[ultimate_actions]
	#Current magicule cost per target for Benevolent Empowerment Mass Grant.
	# Default: 75000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	benevolentMassGrantCostPerTarget = 10000.0
	#Current magicule cost per target for Absolute Governance Mass Grant.
	# Default: 100000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	absoluteMassGrantCostPerTarget = 15000.0
	#Base magicule cost for Benevolent Empowerment Grant Without Mastery.
	# Default: 100000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	benevolentGrantWithoutMasteryBaseCost = 20000.0
	#Base magicule cost for Absolute Governance Grant Without Mastery.
	# Default: 150000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	absoluteGrantWithoutMasteryBaseCost = 25000.0
	#Maximum extra cost added when a Benevolent Grant Without Mastery skill has 0 mastery.
	# Default: 650000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	benevolentGrantWithoutMasteryExtraCost = 100000.0
	#Maximum extra cost added when an Absolute Grant Without Mastery skill has 0 mastery.
	# Default: 350000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	absoluteGrantWithoutMasteryExtraCost = 75000.0
	#Current magicule cost per borrowed skill.
	# Default: 150000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	borrowCostPerSkill = 50000.0
	#Duration of temporary borrowed skills in ticks. 6000 ticks = 5 minutes.
	# Default: 6000
	# Range: > 1
	borrowDurationTicks = 6000
	#Base chance for a borrowed skill to become permanent. 0.02 = 2%.
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	borrowPermanentBaseChance = 0.02
	#Extra permanence chance added for each previous time the same skill was borrowed. 0.01 = +1%.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	borrowPermanentBonusPerPreviousBorrow = 0.01
	#Maximum permanence chance for repeatedly borrowed skills. 0.20 = 20%.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	borrowPermanentMaxChance = 0.2
	#Current magicule cost per seized skill.
	# Default: 250000.0
	# Range: 0.0 ~ 1.7976931348623157E308
	seizeCostPerSkill = 250000.0
	#Chance added per seized skill that the subordinate dies from forced extraction. 0.01 = 1% per skill.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	seizeDeathChancePerSkill = 0.01
	#Maximum death chance from a single multi-skill Seize action. 0.25 = 25%.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	seizeDeathChanceMax = 0.25

[compatibility]
	#Skills listed here cannot be granted, borrowed, or seized by this addon.
	#Use full skill IDs, for example: "tensura:creator".
	#Example inactive entry you may add manually: "tensura:example_skill".
	globalSkillBlacklist = ["moostensuraaddon:granter", "moostensuraaddon:benevolent_empowerment", "moostensuraaddon:absolute_governance", "tensura:creator"]
	#Skills listed here cannot be granted.
	grantSkillBlacklist = []
	#Skills listed here cannot be borrowed.
	borrowSkillBlacklist = []
	#Skills listed here cannot be seized.
	seizeSkillBlacklist = []
